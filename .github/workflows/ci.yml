# Tests on every push / pull request, and an end-to-end smoke test of the live site after every successful Vercel
# deployment of main. Vercel reports to GitHub as a commit status ("Vercel"); scripts/smoke-test.mjs then checks
# the site at the repository variable SITE_URL (Settings -> Secrets and variables -> Actions -> Variables).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  status:

jobs:
  backend:
    if: github.event_name != 'status'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    if: github.event_name != 'status'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  smoke-test:
    if: >-
      github.event_name == 'status' && github.event.context == 'Vercel' && github.event.state == 'success' &&
      contains(github.event.branches.*.name, 'main') && vars.SITE_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node scripts/smoke-test.mjs "${{ vars.SITE_URL }}"
