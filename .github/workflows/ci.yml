# Tests on every push / pull request, and an end-to-end smoke test of every successful Vercel deployment
# (Vercel reports deployments to GitHub; scripts/smoke-test.mjs then checks the live site).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  deployment_status:

jobs:
  backend:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  smoke-test:
    # runs when Vercel (or any host reporting to GitHub) finishes a deployment
    if: >-
      github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/smoke-test.mjs "${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}"
