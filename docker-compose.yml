# Local:  docker compose up --build            -> http://localhost  (website + app)
# AWS:    set DATABASE_URL_OVERRIDE to RDS in .env and run: docker compose up -d --build backend web nginx
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: focuslink
      POSTGRES_PASSWORD: focuslink
      POSTGRES_DB: focuslink
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focuslink"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL_OVERRIDE:-postgresql+psycopg2://focuslink:focuslink@db:5432/focuslink}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost}
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - web
    restart: unless-stopped

volumes:
  pgdata:
