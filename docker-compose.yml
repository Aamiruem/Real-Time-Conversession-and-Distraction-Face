# Settings live in backend/.env (copy backend/.env.example). Pass it with --env-file so SITE_URL and
# DATABASE_URL_OVERRIDE below are filled in from it too.
# Local:  docker compose --env-file backend/.env up --build      -> http://localhost  (website + app)
# AWS:    set DATABASE_URL_OVERRIDE to RDS in backend/.env and run:
#         docker compose --env-file backend/.env up -d --build --no-deps backend web nginx
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: focuslink
      POSTGRES_PASSWORD: focuslink
      POSTGRES_DB: focuslink
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focuslink"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL_OVERRIDE:-postgresql+psycopg2://focuslink:focuslink@db:5432/focuslink}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost}
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - web
    restart: unless-stopped

volumes:
  pgdata:
