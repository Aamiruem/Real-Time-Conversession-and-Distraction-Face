# Render Blueprint: backend API (Docker) + managed PostgreSQL, wired together.
#   Render dashboard -> New -> Blueprint -> pick this repo. Then deploy the frontend on Vercel (frontend/vercel.json).
# Values marked `sync: false` are asked for on the first deploy (leave optional ones empty).
services:
  - type: web
    name: presence-api # -> https://presence-api.onrender.com (if the name is taken Render adds a suffix: use that URL)
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    # speech analysis (Whisper) + ML need ~1 GB RAM: "starter" or larger. "free" boots, but sleeps when idle and
    # can run out of memory on the first speech analysis.
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    # camera recordings when S3 is off: Render's own filesystem is wiped on every deploy, a disk is kept
    disk:
      name: recordings
      mountPath: /data/recordings
      sizeGB: 5
    envVars:
      - key: RECORDINGS_DIR
        value: /data/recordings
      - key: DATABASE_URL
        fromDatabase:
          name: presence-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_NAME
        value: Presence AI
      - key: ALLOW_GUESTS # "Continue as guest": anyone can try the app without an account
        value: "true"
      - key: REQUIRE_VERIFICATION
        value: "false"
      - key: SITE_URL # your Vercel URL, e.g. https://presence-ai.vercel.app
        sync: false
      # --- optional ---
      - key: MONGODB_URI # MongoDB Atlas mirror, e.g. mongodb+srv://user:pass@cluster.mongodb.net/
        sync: false
      - key: MONGODB_DB
        value: presence_ai
      - key: ANTHROPIC_API_KEY # AI coach answers with Claude (built-in coach without it)
        sync: false
      - key: AWS_ENABLED # S3 reports, SES email / SNS SMS codes, Comprehend
        value: "false"
      - key: AWS_REGION
        value: ap-south-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: TURN_URLS # meetings across strict firewalls / mobile data: turn:host:3478,turns:host:5349
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false

databases:
  - name: presence-db
    databaseName: focuslink
    user: focuslink
    plan: basic-256mb # "free" works for trying it out (Render deletes free databases after 30 days)
