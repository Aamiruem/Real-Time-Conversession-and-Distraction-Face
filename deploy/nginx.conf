# Public entry point — one domain:
#   /        -> Next.js (server-rendered website + React app; it proxies /api/* to FastAPI itself)
#   /ws/     -> FastAPI WebSockets (chat rooms) — browsers connect here directly
#   /api/    -> FastAPI REST, routed straight to the backend (skips a hop through Next.js; long timeouts for speech)
# HTTPS is required for webcam/microphone access in browsers — see docs/PIPELINE.md step 9.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name _;
    client_max_body_size 30m;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        gzip on;
        gzip_types text/css application/javascript application/json application/xml image/svg+xml;
    }
}
