# Public entry point. One domain, three upstreams:
#   /            -> FastAPI: SEO landing page, robots.txt, sitemap.xml, /static, /docs
#   /app/        -> Streamlit app (needs WebSockets; runs with --server.baseUrlPath=app)
#   /api/  /ws/  -> FastAPI REST + WebSockets (optional public API)
# HTTPS is required for webcam/microphone access in browsers — see docs/PIPELINE.md (Let's Encrypt).
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location /app/ {
        proxy_pass http://frontend:8501/app/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        gzip on;
        gzip_types text/css application/xml text/plain application/json;
    }
}
