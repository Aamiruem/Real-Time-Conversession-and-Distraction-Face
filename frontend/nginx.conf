# Static server for the built React app (frontend container, port 3000).
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml application/manifest+json
               application/wasm;  # the MediaPipe vision engine: ~11 MB -> ~3.5 MB

    # hashed build assets and models never change -> cache for a year
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location /mediapipe/ { expires 30d; add_header Cache-Control "public"; try_files $uri =404; }

    # pre-rendered public pages are real files; /app/* is rendered in the browser from the app shell
    location /app { try_files $uri /app.html; }
    location ~ "^/[a-z]{3}-[a-z]{4}-[a-z]{3}$" { try_files /app.html =404; }  # meeting links: /abc-defg-hij
    location / { try_files $uri $uri/index.html =404; }
    error_page 404 /404.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
}
